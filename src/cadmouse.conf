# CadMouse 服务/默认配置（GUI 写入用户选项；helper 读取本文件）
# 查找顺序：--config 显式路径 > 可执行文件同目录 cadmouse.conf

device_path=/dev/cadmouse_config

# 心跳间隔（秒），支持小数，例如 2 或 1.5
heartbeat_interval_sec=2

# 启动后首次初始化前等待（秒）
heartbeat_startup_delay_sec=0.5

# 默认速度档位 1-5（4 对应协议字节 0x1c，与旧脚本一致）
speed=4

# 默认轮询率 Hz：125 / 250 / 500 / 1000
polling_hz=1000

# 按键重映射：1/true/on 开启，0/false/off 关闭
remap_wheel=1
remap_gesture=1
